services:
  - type: web
    name: local-hospital-guide
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PROVIDER
        value: openai
      - key: VITE_KAKAO_JS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
